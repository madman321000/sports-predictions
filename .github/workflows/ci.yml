name: Go CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sports
          POSTGRES_PASSWORD: sports
          POSTGRES_DB: sports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sports -d sports_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sports:sports@localhost:5432/sports_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Run all tests with race detection and coverage
        run: go test -race -count=1 -timeout=5m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -v ./...
      - name: Generate coverage reports
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          {
            echo '### Go coverage'
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
          if-no-files-found: error
          retention-days: 14
