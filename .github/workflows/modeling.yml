name: Modeling CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modeling:
    name: Python modeling tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modeling/requirements.txt
      - run: python -m pip install -r modeling/requirements.txt
      - run: python -m ruff check modeling
      - run: python -m ruff format --check modeling
      - name: Test offline modeling
        run: |
          python -m coverage run --source=modeling --omit='modeling/tests/*' -m unittest discover -s modeling/tests -v
          python -m coverage report -m
          python -m coverage xml -o modeling-coverage.xml
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: modeling-coverage
          path: modeling-coverage.xml
          if-no-files-found: error
          retention-days: 14
